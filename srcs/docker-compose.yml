services:
  mariadb:
    build: ./requirements/mariadb
    image: inception-mariadb:1.0
    container_name: mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
    secrets:
      - db_root_password
      - db_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u wordpress -p$$(cat /run/secrets/db_password)"]
      interval: 5s
      timeout: 3s
      retries: 5

  wordpress:
    build: ./requirements/wordpress
    image: inception-wordpress:1.0
    container_name: wordpress
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy   # optional, but safe
    environment:
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/db_password
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_NAME: wordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      DOMAIN_NAME: atambo.42.fr
      WP_ADMIN_USER: your_admin_login        # change to your admin username
      WP_ADMIN_EMAIL: admin@example.com
      WP_USER: your_normal_user              # change to your normal user
      WP_USER_EMAIL: user@example.com
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password
      WP_USER_PASSWORD_FILE: /run/secrets/wp_user_password
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/wordpress
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    image: inception-nginx:1.0
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - wordpress_data:/var/www/wordpress
    networks:
      - inception

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/atambo/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/atambo/data/wordpress

networks:
  inception:
    driver: bridge

secrets:
  db_root_password:
    file: ~/.inception_secrets/db_root_password.txt
  db_password:
    file: ~/.inception_secrets/db_password.txt
  wp_admin_password:
    file: ~/.inception_secrets/wp_admin_password.txt
  wp_user_password:
    file: ~/.inception_secrets/wp_user_password.txt