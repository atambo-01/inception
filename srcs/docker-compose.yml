services:
  mariadb:
    build:
      context: ./requirements/mariadb
    container_name: mariadb
    image: inception-mariadb
    env_file:
      - ../.env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  inception:
    driver: bridge
